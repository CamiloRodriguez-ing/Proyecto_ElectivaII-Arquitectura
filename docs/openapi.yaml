openapi: 3.0.3
info:
  title: Student Requests API
  version: 1.0.0
  description: Stateless academic request API for the first demonstration stage.
servers:
  - url: http://localhost:3000
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content: {application/json: {schema: {$ref: '#/components/schemas/SuccessResponse'}}}
  /v1/requests/validate:
    post:
      operationId: validateRequest
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequestInput'}}}}
      responses:
        '200': {description: Validation result}
        '400': {$ref: '#/components/responses/BadRequest'}
  /v1/requests/prepare:
    post:
      operationId: prepareRequest
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequestInput'}}}}
      responses:
        '201': {description: Prepared non-persisted request}
        '422': {$ref: '#/components/responses/ValidationError'}
  /v1/reviews/evaluate:
    post:
      operationId: evaluateRequest
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationInput'}}}}
      responses:
        '200': {description: Evaluated request and domain event}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/notifications/preview:
    post:
      operationId: previewNotification
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationInput'}}}}
      responses: {'200': {description: Notification preview}}
  /v1/analytics/summary:
    post:
      operationId: summarizeRequests
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [requests], properties: {requests: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Request'}}}}}}}
      responses: {'200': {description: Analytics summary}}
components:
  responses:
    BadRequest: {description: Invalid JSON or incomplete request}
    ValidationError: {description: Business validation error}
    Conflict: {description: State transition is not allowed}
  schemas:
    SuccessResponse: {type: object, required: [data, meta], properties: {data: {type: object}, meta: {$ref: '#/components/schemas/Meta'}}}
    Meta: {type: object, required: [request_id, api_version], properties: {request_id: {type: string}, api_version: {type: string, example: v1}, timestamp: {type: string, format: date-time}}}
    Student: {type: object, required: [student_code, name, email], properties: {student_code: {type: string}, name: {type: string}, email: {type: string, format: email}}}
    Document: {type: object, required: [name, mime_type, size_bytes], properties: {name: {type: string}, mime_type: {type: string, enum: [application/pdf]}, size_bytes: {type: integer, minimum: 1, maximum: 10000000}}}
    AcademicData: {type: object, required: [source_course, target_course, source_credits, target_credits], properties: {source_course: {type: string}, target_course: {type: string}, source_credits: {type: integer}, target_credits: {type: integer}}}
    RequestInput: {type: object, required: [student, type, academic_data], properties: {student: {$ref: '#/components/schemas/Student'}, type: {type: string, enum: [CREDIT_TRANSFER]}, academic_data: {$ref: '#/components/schemas/AcademicData'}, documents: {type: array, items: {$ref: '#/components/schemas/Document'}}}}
    Request: {allOf: [{$ref: '#/components/schemas/RequestInput'}, {type: object, required: [request_id, status, version], properties: {request_id: {type: string, format: uuid}, status: {type: string}, version: {type: integer}}}]}
    EvaluationInput: {type: object, required: [request, evaluation], properties: {request: {$ref: '#/components/schemas/Request'}, evaluation: {type: object, required: [decision, observation, actor], properties: {decision: {type: string, enum: [APPROVE, REJECT, REQUEST_CHANGES]}, observation: {type: string}, actor: {type: object, required: [id, role], properties: {id: {type: string}, role: {type: string}}}}}}}
    NotificationInput: {type: object, required: [event, recipient], properties: {event: {type: object}, recipient: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}
